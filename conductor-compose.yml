services:
  app:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    command: ["/home/conductor/init-claude-config.sh", "sleep", "infinity"]
    stdin_open: true
    tty: true
    volumes:
      - .:/workspaces/basic-project-setup:cached
      - ${HOME}/.claude:/host-claude-config/.claude:ro
      - ${HOME}/.claude.json:/host-claude-config/.claude.json:ro
      - /Users/davidtaylor/Repositories/tmux-conductor:/conductor-repo:ro
      - /Users/davidtaylor/Repositories/tmux-conductor/logs/state:/conductor-state
      - /Users/davidtaylor/Repositories/tmux-conductor/logs:/conductor-logs
    working_dir: /workspaces/basic-project-setup
    env_file:
      - ${HOME}/.conductor_env
    environment:
      - CONDUCTOR_STATE_DIR=/conductor-state
      - CONDUCTOR_LOG_DIR=/conductor-logs
      - CONDUCTOR_AGENT_NAME=basic-project-setup
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
